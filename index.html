<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>我的博客</title>

<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/style.css">
<script>
  // 在样式加载前设置主题，避免页面闪烁
  (function () {
    var saved = localStorage.getItem("theme");
    var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = saved || (prefersDark ? "dark" : "light");
  })();
</script>
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="index.html">我的博客</a>

      <a href="about.html">关于</a>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换主题">🌙</button>
    </nav>
  </div>
</header>

<main class="container">

  <section class="hero">

  </section>

  <section class="post-list">
    <h2 class="section-title">最新文章</h2>

    <article class="post-card">
      <a class="post-card-link" href="posts/hello-world.html">
        <h3>第一篇文章：为什么我要开始写博客</h3>

      </a>
      <div class="post-meta">
        <time datetime="2026-10-09">2026-10-09</time>

    <article class="post-card">
      <a class="post-card-link" href="posts/how-to-add-a-post.html">
        <h3>如何给这个博客添加一篇新文章</h3>
        <p class="excerpt">三步搞定：复制模板、写入内容、在首页加上一张卡片。完全不需要任何构建工具。</p>

</main>
